name: Bug report
description: The payload did not set the clock, or behaved unexpectedly.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Payload version
      description: Shown in the notification, e.g. v1.1.0.
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: PS5 firmware version
      placeholder: e.g. 10.01
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Exploit and ELF loader
      description: Which exploit and loader (and version) launched the payload.
      placeholder: e.g. elfldr via BD-J, Payload Manager
    validations:
      required: true
  - type: input
    id: notification
    attributes:
      label: Notification text
      description: The exact message the payload displayed.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Payload output
      description: >-
        The payload's log output, if your loader shows it (for example via
        `socat` or the loader's log). This is usually what pinpoints the
        problem.
      render: text
  - type: textarea
    id: network
    attributes:
      label: Network setup
      description: >-
        Anything unusual: VPN, Pi-hole or custom DNS, firewall rules,
        blocked UDP port 123, proxy, etc.
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
